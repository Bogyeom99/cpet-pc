name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile Python files
        run: python -m py_compile main.py services/*.py ui/*.py tests/*.py

      - name: Verify desktop and local-only imports
        run: |
          python -c "from ui.main_window import MainWindow, LocalOnlyInterceptor; print(MainWindow.__name__)"
          python -c "from services import athlete_store; assert athlete_store.is_configured(); print(athlete_store.DB_PATH)"
          python -c "from services import workflow; assert hasattr(workflow, 'analyze')"

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
